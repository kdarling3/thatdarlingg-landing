<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>That Darlingg</title>
<meta name="description" content="That Darlingg: DIY, home and lifestyle. A little refresh is underway. We'll be back soon.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f6f0e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6f0e6;
    --taupe: #a8978a;
    --brown: #5e4b3c;
    --line: #cdbfb0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cream);
    color: var(--brown);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 36rem; width: 100%; }
  .tag {
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 0.78rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--taupe);
    margin: 0 0 1.6rem;
    padding-left: 0.42em;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 4.2rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1.1;
    margin: 0 0 1.8rem;
    padding-left: 0.16em;
    color: var(--brown);
  }
  .rule {
    width: 4.5rem;
    height: 1px;
    background: var(--line);
    border: 0;
    margin: 0 auto 1.8rem;
  }
  .sub {
    font-style: italic;
    font-size: clamp(1.3rem, 4.5vw, 1.7rem);
    color: var(--brown);
    margin: 0 0 0.9rem;
  }
  .soon {
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    color: var(--taupe);
    margin: 0;
  }
</style>
</head>
<body>
  <main>
    <p class="tag">DIY &middot; Home &middot; Lifestyle</p>
    <h1>That Darlingg</h1>
    <hr class="rule">
    <p class="sub">A little refresh is underway.</p>
    <p class="soon">We'll be back soon. &#9825;</p>
  </main>
</body>
</html>
